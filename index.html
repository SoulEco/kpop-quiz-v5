<!DOCTYPE html>
<html lang="zh-CN">
<head>

    * { box-sizing: border-box; }

    .wrap { max-width: 480px; margin: 0 auto; padding: 24px; }
    .hidden { display: none !important; }
    
    /* 通用样式 */
    .hero { text-align: center; padding: 40px 0; }

    .code-input { width: 100%; padding: 18px; font-size: 26px; letter-spacing: 8px; text-align: center; text-transform: uppercase; border: 2px solid #222; background: #151515; color: #fff; border-radius: 12px; outline: none; }

    .msg { color: #ff4444; font-size: 13px; margin-top: 12px; text-align: center; min-height: 18px; }
    
    /* 代际选择 */
    .gen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }

    .gen-card h3 { margin: 0 0 8px; font-size: 16px; color: #ff6b9d; }
    .gen-card p { margin: 0; font-size: 11px; color: #888; line-height: 1.4; }

    .progress-fill { height: 100%; background: linear-gradient(90deg, #ff3366, #ff6b9d); width: 0%; transition: width 0.4s; }
    .q-text { font-size: 18px; line-height: 1.6; font-weight: 600; margin-bottom: 24px; }
    .opt { width: 100%; padding: 14px; background: #151515; border: 1.5px solid #222; color: #fff; border-radius: 10px; margin-bottom: 10px; text-align: left; cursor: pointer; font-size: 14px; line-height: 1.5; }

    canvas { max-width: 100%; height: auto; }

    .dim-name { font-size: 14px; font-weight: bold; color: #fff; }
    .dim-match { font-size: 12px; color: #ff6b9d; }

    .status-badge { display: inline-block; padding: 4px 12px; background: rgba(255,51,102,0.15); color: #ff6b9d; border-radius: 20px; font-size: 12px; margin-top: 12px; }

    .gen-tab.active { border-color: #ff3366; color: #ff6b9d; background: #2a1018; }

  </style>
</head>
<body>
<div class="wrap">

      <button class="btn-secondary" id="nextBtn" onclick="nextQuestion()" disabled>下一题 →</button>
    </div>
  </div>

<!-- Page 4: 结算确认 -->
<div id="page-confirm" class="hidden">
  <div class="confirm-box">
    <div style="font-size:60px; margin-bottom:20px;">🎯</div>

    <div id="statusArea" style="text-align:center;"></div>
    <button class="btn-secondary" style="margin-top:10px;" onclick="location.reload()">返回首页</button>
  </div>

</div>

const GEN_NAMES = { gen2: '二代', gen3: '三代', gen4: '四代', gen5: '五代' };

// ========== 状态 ==========
let currentCode = '';
let currentGen = '';
let remaining = 0;
let serverResults = {};
let answers = new Array(20).fill(null);
let currentQ = 0;

function show(id) {
  document.querySelectorAll('.wrap > div').forEach(d => d.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}
function showMsg(text) { document.getElementById('msg').innerText = text; }

// 1. 验证授权码
async function checkCode() {
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  if (code.length !== 6) return showMsg('请输入完整的 6 位授权码');

  const btn = document.getElementById('checkBtn');
  btn.disabled = true; btn.innerText = '验证中...'; showMsg('');

  try {
    const res = await fetch('/api/check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) });
    const data = await res.json();
    if (data.error) { showMsg(data.error); btn.disabled = false; btn.innerText = '开始测试'; return; }

    currentCode = code;
    remaining = data.remaining;
    serverResults = data.results || {};
    const hasResult = Object.keys(serverResults).length > 0;

    if (remaining > 0) {
      document.getElementById('genRemainHint').innerText = `剩余 ${remaining} 次测试机会`;
      document.getElementById('viewResultBtn').style.display = hasResult ? 'block' : 'none';
      show('page-gen');
    } else {
      if (hasResult) {
        currentGen = Object.keys(serverResults)[0];
        showResultView();
      } else {
        showMsg('该授权码测试次数已用完，且无测试记录');
      }
    }
    btn.disabled = false; btn.innerText = '开始测试';
  } catch (e) {
    showMsg('网络错误'); btn.disabled = false; btn.innerText = '开始测试';
  }
}

// 2. 选代际进入答题
function selectGen(gen) {
  if (remaining <= 0) return alert('测试次数已用完，无法再次测试');
  currentGen = gen;
  answers = new Array(20).fill(null);
  currentQ = 0;
  document.getElementById('remainHint').innerText = `剩余 ${remaining} 次`;
  show('page-quiz');
  renderQuestion();
}

// 3. 渲染题目
function renderQuestion() {
  const q = questions[currentGen][currentQ]; // 根据代际取题
  document.getElementById('qNum').innerText = currentQ + 1;
  document.getElementById('qText').innerText = q.q;
  document.getElementById('prog').style.width = `${(currentQ / 20) * 100}%`;
  document.getElementById('prevBtn').disabled = (currentQ === 0);
  document.getElementById('nextBtn').disabled = (answers[currentQ] === null);

  const container = document.getElementById('opts');
  container.innerHTML = '';
  q.opts.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt' + (answers[currentQ] === idx ? ' selected' : '');
    btn.innerText = opt.t;
    btn.onclick = () => selectOption(idx);
    container.appendChild(btn);
  });
}

// 4. 选选项
function selectOption(idx) {
  answers[currentQ] = idx;
  renderQuestion();
}

// 5. 上一题
function prevQuestion() {
  if (currentQ > 0) { currentQ--; renderQuestion(); }
}

// 6. 下一题
function nextQuestion() {
  if (answers[currentQ] === null) return;
  currentQ++;
  if (currentQ < 20) renderQuestion();
  else show('page-confirm');
}

// 7. 返回检查
function backToLastQ() {
  currentQ = 19;
  document.getElementById('remainHint').innerText = `剩余 ${remaining} 次`;
  show('page-quiz');
  renderQuestion();
}

// 8. 开始结算
function startCalc() {
  show('page-calc');
  const fill = document.getElementById('calcFill');
  const pct = document.getElementById('calcPct');
  const txt = document.getElementById('calcText');
  const steps = ['正在解析你的 20 个选择...', '构建 5 维性格向量场...', '扫描候选原型人格图谱...', '计算多维空间共振频率...', '生成专属档案海报...'];
  let p = 0, lastSi = -1;
  fill.style.width = '0%'; pct.innerText = '0%'; txt.innerText = steps[0];
  const iv = setInterval(() => {
    p += 100 / 30;
    if (p >= 100) {
      p = 100; clearInterval(iv);
      fill.style.width = '100%'; pct.innerText = '100%';
      setTimeout(submitResult, 300);
      return;
    }
    fill.style.width = p + '%';
    pct.innerText = Math.floor(p) + '%';
    const si = Math.min(steps.length - 1, Math.floor(p / 100 * steps.length));
    if (si !== lastSi) { txt.innerText = steps[si]; lastSi = si; }
  }, 100);
}

// 9. 计算分数
function calcScores() {
  const s = [0, 0, 0, 0, 0];
  answers.forEach((idx, i) => {
    if (idx != null) {
      const opt = questions[currentGen][i].opts[idx];
      for (let j = 0; j < 5; j++) s[j] += opt.s[j];
    }
  });
  return s;
}

// 10. 匹配 + 保存
async function submitResult() {
  const userScores = calcScores();
  
  // 计算主结果 (总分最接近)
  let bestMatch = idols[currentGen][0], minDiff = Infinity;
  idols[currentGen].forEach(idol => {
    let diff = 0;
    for (let i = 0; i < 5; i++) diff += Math.pow(userScores[i] - idol.scores[i], 2);
    if (diff < minDiff) { minDiff = diff; bestMatch = idol; }
  });

  // 计算 5 个维度的单项冠军
  const dimChampions = [];
  for (let i = 0; i < 5; i++) {
    let bestIdol = idols[currentGen][0], minD = Infinity;
    idols[currentGen].forEach(idol => {
      const d = Math.abs(userScores[i] - idol.scores[i]);
      if (d < minD) { minD = d; bestIdol = idol; }
    });
    dimChampions.push(bestIdol);
  }

  const resultData = { 
    name: bestMatch.name, desc: bestMatch.desc, detail: bestMatch.detail, 
    scores: userScores, 
    dimChampions: dimChampions.map(id => id.name),
    matched_at: new Date().toISOString() 
  };

  try {
    const res = await fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: currentCode, gen: currentGen, resultData }) });
    const data = await res.json();
    if (data.success) {
      remaining = data.remaining;
      serverResults[currentGen] = data.result;
      showResultView();
    } else {
      alert('保存失败：' + data.error);
      location.reload();
    }
  } catch (e) {
    alert('网络错误'); location.reload();
  }
}

// 11. 渲染结果页 (含雷达图)
function showResultView() {
  renderTabs();
  renderResultContent(currentGen);
  const statusArea = document.getElementById('statusArea');
  if (remaining > 0) {
    statusArea.innerHTML = `<div class="status-badge">剩余 ${remaining} 次测试机会</div><button class="btn-primary" style="margin-top:16px;" onclick="show('page-gen')">继续测试其他代际</button>`;
  } else {
    statusArea.innerHTML = `<div class="status-badge">测试次数已用完 · 最终档案</div>`;
  }
  show('page-result');
}

function renderTabs() {
  const tabs = document.getElementById('genTabs');
  const keys = Object.keys(serverResults);
  tabs.innerHTML = '';
  if (keys.length === 0) return;
  keys.forEach(k => {
    const t = document.createElement('div');
    t.className = 'gen-tab' + (k === currentGen ? ' active' : '');
    t.innerText = GEN_NAMES[k] || k;
    t.onclick = () => { currentGen = k; renderTabs(); renderResultContent(k); };
    tabs.appendChild(t);
  });
}

function renderResultContent(gen) {
  const r = serverResults[gen];
  if (!r) return;
  
  const container = document.getElementById('resultContent');
  const dimKeys = ['E', 'T', 'D', 'A', 'C'];
  
  let dimHtml = '';
  for (let i = 0; i < 5; i++) {
    const key = dimKeys[i];
    const full = DIM_FULL[key];
    const champion = r.dimChampions[i];
    dimHtml += `
      <div class="dim-item">
        <div class="dim-header">
          <span class="dim-name">${full.name} (得分: ${r.scores[i]})</span>
          <span class="dim-match">最像: ${champion}</span>
        </div>
        <div class="dim-desc">${full.desc}</div>
      </div>
    `;
  }

  container.innerHTML = `
    <div class="main-result">
      <div class="tag">K-POP PERSONALITY ARCHIVE · ${GEN_NAMES[gen]}</div>
      <h2>${r.name}</h2>
      <div class="sub-tag">${r.desc}</div>
      <div class="summary">
        <strong>🔍 匹配依据：</strong> 你的 5 维性格向量与 ${r.name} 的高度重合。
        在${DIM_FULL.E.name}维度你展现了${r.scores[0] > 40 ? '极强的' : '适度的'}能量，
        在${DIM_FULL.A.name}维度你倾向于${r.scores[3] > 40 ? '主动出击' : '温和处世'}。
        综合来看，你拥有${r.detail.substring(0, 30)}...的特质。
      </div>
    </div>
    
    <div class="radar-box">
      <h4>📊 五维人格雷达图</h4>
      <canvas id="radarCanvas" width="300" height="300"></canvas>
    </div>
    
    <div class="dim-details">
      <h4 style="font-size:14px; color:#ff6b9d; margin-bottom:15px;">🧬 维度深度解析</h4>
      ${dimHtml}
    </div>
    
    <div class="poster-footer">本档案基于你的选择生成 · 仅供趣味探索</div>
  `;

  // 绘制雷达图
  setTimeout(() => drawRadar(r.scores, r.dimChampions), 100);
}

// 12. 绘制雷达图 (Canvas)
function drawRadar(scores, champions) {
  const canvas = document.getElementById('radarCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const cx = w / 2, cy = h / 2;
  const R = 100; // 半径
  const maxScore = 80; // 20题 x 4分
  
  ctx.clearRect(0, 0, w, h);
  
  // 画网格 (5层)
  for (let level = 1; level <= 5; level++) {
    const r = (R / 5) * level;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const angle = (Math.PI * 2 / 5) * i - Math.PI / 2;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  
  // 画轴线
  for (let i = 0; i < 5; i++) {
    const angle = (Math.PI * 2 / 5) * i - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + R * Math.cos(angle), cy + R * Math.sin(angle));
    ctx.strokeStyle = '#444';
    ctx.stroke();
  }
  
  // 画数据多边形
  ctx.beginPath();
  const points = [];
  for (let i = 0; i < 5; i++) {
    const angle = (Math.PI * 2 / 5) * i - Math.PI / 2;
    const r = (scores[i] / maxScore) * R;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    points.push({x, y, angle});
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(255, 51, 102, 0.3)';
  ctx.fill();
  ctx.strokeStyle = '#ff3366';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // 画顶点和文字
  ctx.fillStyle = '#fff';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  
  for (let i = 0; i < 5; i++) {
    const p = points[i];
    // 画圆点
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#ff3366';
    ctx.fill();
    
    // 文字位置 (向外偏移)
    const tx = cx + (R + 25) * Math.cos(p.angle);
    const ty = cy + (R + 25) * Math.sin(p.angle);
    
    // 维度名 + 分数
    ctx.fillStyle = '#ff6b9d';
    ctx.fillText(`${DIM_NAMES[i]}`, tx, ty - 8);
    ctx.fillStyle = '#fff';
    ctx.fillText(`${scores[i]}分`, tx, ty + 8);
    
    // 冠军名字 (再向外)
    const tx2 = cx + (R + 55) * Math.cos(p.angle);
    const ty2 = cy + (R + 55) * Math.sin(p.angle);
    ctx.fillStyle = '#888';
    ctx.font = '10px sans-serif';
    // 简短名字
    const shortName = champions[i].split(' ')[0]; 
    ctx.fillText(shortName, tx2, ty2);
  }
}

document.getElementById('codeInput').addEventListener('input', function(e) { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
document.getElementById('codeInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') checkCode(); });
