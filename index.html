<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-pop 性格原型测试</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'PingFang SC', sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px; }
  .hidden { display: none !important; }
  
  /* 通用样式 */
  .hero { text-align: center; padding: 40px 0; }
  .hero h1 { font-size: 26px; margin: 0 0 12px; background: linear-gradient(135deg, #ff3366, #ff6b9d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .hero p { color: #888; font-size: 14px; line-height: 1.6; margin: 0 0 30px; }
  .code-input { width: 100%; padding: 18px; font-size: 26px; letter-spacing: 8px; text-align: center; text-transform: uppercase; border: 2px solid #222; background: #151515; color: #fff; border-radius: 12px; outline: none; }
  .code-input:focus { border-color: #ff3366; }
  .btn-primary { width: 100%; padding: 16px; background: linear-gradient(135deg, #ff3366, #ff6b9d); color: #fff; font-weight: bold; border: none; border-radius: 12px; font-size: 17px; cursor: pointer; margin-top: 16px; }
  .btn-primary:disabled { opacity: 0.5; }
  .msg { color: #ff4444; font-size: 13px; margin-top: 12px; text-align: center; min-height: 18px; }
  
  /* 代际选择 */
  .gen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
  .gen-card { background: #151515; border: 1.5px solid #222; border-radius: 12px; padding: 20px 12px; text-align: center; cursor: pointer; transition: 0.2s; }
  .gen-card:hover { border-color: #ff3366; background: #1a1015; }
  .gen-card h3 { margin: 0 0 8px; font-size: 16px; color: #ff6b9d; }
  .gen-card .info-link { display: block; margin-top: 10px; font-size: 11px; color: #ff6b9d; text-decoration: underline; }
  
  /* 答题页 */
  .quiz-header { display: flex; justify-content: space-between; font-size: 13px; color: #888; margin-bottom: 16px; }
  .progress { height: 4px; background: #222; border-radius: 2px; overflow: hidden; margin-bottom: 24px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #ff3366, #ff6b9d); width: 0%; transition: width 0.4s; }
  .q-text { font-size: 18px; line-height: 1.6; font-weight: 600; margin-bottom: 24px; }
  .opt { width: 100%; padding: 14px; background: #151515; border: 1.5px solid #222; color: #fff; border-radius: 10px; margin-bottom: 10px; text-align: left; cursor: pointer; font-size: 14px; line-height: 1.5; }
  .opt:hover { border-color: #ff3366; }
  .opt.selected { border-color: #ff3366; background: #2a1018; }
  .quiz-nav { display: flex; gap: 10px; margin-top: 8px; }
  .btn-secondary { flex: 1; padding: 14px; background: #1a1a1a; color: #fff; border: 1px solid #333; border-radius: 12px; font-size: 15px; cursor: pointer; }
  .btn-secondary:disabled { opacity: 0.3; cursor: not-allowed; }
  
  /* ========== 结果页：小红书多页风格 ========== */
  .gen-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .gen-tab { padding: 6px 14px; background: #1a1a1a; border: 1px solid #333; border-radius: 20px; font-size: 13px; cursor: pointer; color: #888; }
  .gen-tab.active { border-color: #ff3366; color: #ff6b9d; background: #2a1018; }
  
  /* 每一页卡片 */
  .page-card {
    background: #151515;
    border: 1px solid #2a2a2a;
    border-radius: 20px;
    padding: 30px 24px;
    margin-bottom: 20px;
    position: relative;
    overflow: hidden;
  }
  /* 卡片顶部装饰条 */
  .page-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, #ff3366, #ff6b9d);
  }
  
  /* A 页：总体概览 */
  .a-page-title { font-size: 12px; color: #ff6b9d; letter-spacing: 2px; text-align: center; margin-bottom: 20px; }
  .a-page-name { font-size: 32px; font-weight: 800; text-align: center; margin: 0 0 10px; background: linear-gradient(135deg, #fff, #ff6b9d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .a-page-desc { font-size: 18px; font-weight: bold; text-align: center; color: #fff; margin: 0 0 20px; } /* desc 不要用小字 */
  .radar-box { background: #0f0f0f; border-radius: 12px; padding: 20px; margin: 20px 0; text-align: center; }
  .radar-box h4 { margin: 0 0 15px; font-size: 14px; color: #ff6b9d; }
  canvas { max-width: 100%; height: auto; }
  .a-page-summary { font-size: 14px; color: #aaa; line-height: 1.6; text-align: center; background: rgba(255,51,102,0.05); padding: 12px; border-radius: 8px; border-left: 3px solid #ff3366; }
  
  /* B 页：深度人设 */
  .b-page-desc-large { font-size: 26px; font-weight: 800; text-align: center; color: #fff; margin: 0 0 10px; line-height: 1.4; } /* desc 醒目字体 */
  .b-page-name-small { font-size: 14px; text-align: center; color: #666; margin: 0 0 20px; letter-spacing: 1px; } /* 原型名视觉弱于 desc */
  .b-page-detail { font-size: 15px; color: #ccc; line-height: 1.8; text-align: justify; } /* 长文本 */
  
  /* C 页：维度解析 */
  .c-page-title { font-size: 16px; font-weight: bold; color: #ff6b9d; text-align: center; margin: 0 0 20px; }
  .dim-block { margin-bottom: 24px; border-bottom: 1px solid #222; padding-bottom: 20px; }
  .dim-block:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .dim-header-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .dim-name-score { font-size: 15px; font-weight: bold; color: #fff; } /* 一般醒目 */
  .dim-champion { font-size: 14px; font-weight: bold; color: #ff6b9d; } /* 较醒目 */
  
  /* 条形图样式 */
  .bar-container { width: 100%; height: 10px; background: transparent; border: 1px solid #ff3366; border-radius: 5px; margin: 10px 0; position: relative; overflow: hidden; } /* 细边框，无色底 */
  .bar-fill { height: 100%; background: #ff3366; border-radius: 5px; } /* 填色与边框一致 */
  
  .dim-desc-text { font-size: 12px; color: #888; line-height: 1.5; margin-top: 8px; } /* 一般醒目 */
  
  .poster-footer { text-align: center; font-size: 11px; color: #555; margin-top: 10px; }
  .status-badge { display: inline-block; padding: 4px 12px; background: rgba(255,51,102,0.15); color: #ff6b9d; border-radius: 20px; font-size: 12px; margin-top: 12px; }
  
  /* 结算动画 */
  .confirm-box, .calc-box { text-align: center; padding: 50px 0; }
  .calc-box .spinner { font-size: 50px; margin-bottom: 30px; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .calc-bar { height: 6px; background: #222; border-radius: 3px; overflow: hidden; margin: 20px 0; }
  .calc-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff3366, #ff6b9d); border-radius: 3px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Page 1: 输入授权码 -->
  <div id="page-input">
    <div class="hero">
      <h1>✨ 解锁你的 K-pop 灵魂原型</h1>
      <p>深度情境测试 · 匹配你的本命 Idol 人格<br>输入授权码开始测试或查看已生成的档案</p>
      <input type="text" id="codeInput" class="code-input" maxlength="6" placeholder="输入 6 位授权码" autocomplete="off">
      <button class="btn-primary" id="checkBtn" onclick="checkCode()">开始测试</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <!-- Page 2: 代际选择 -->
  <div id="page-gen" class="hidden">
    <div class="hero" style="padding:30px 0;">
      <h1>选择你的测试宇宙</h1>
      <p>每个宇宙包含该时代最具代表性的女团原型<br><span id="genRemainHint" style="color:#ff6b9d;"></span></p>
    </div>
    
    <div class="gen-grid">
      <div class="gen-card" onclick="selectGen('gen2')">
        <h3>二代 · 情怀考古</h3>
        <a href="gen2.html" class="info-link" onclick="event.stopPropagation()">📖 了解该代女团</a>
      </div>
      <div class="gen-card" onclick="selectGen('gen3')">
        <h3>三代 · 个性顶流</h3>
        <a href="gen3.html" class="info-link" onclick="event.stopPropagation()">📖 了解该代女团</a>
      </div>
      <div class="gen-card" onclick="selectGen('gen4')">
        <h3>四代 · 流量主力</h3>
        <a href="gen4.html" class="info-link" onclick="event.stopPropagation()">📖 了解该代女团</a>
      </div>
      <div class="gen-card" onclick="selectGen('gen5')">
        <h3>五代 · 新粉选秀</h3>
        <a href="gen5.html" class="info-link" onclick="event.stopPropagation()">📖 了解该代女团</a>
      </div>
    </div>
    
    <!-- 👇 补回这个被误删的按钮 👇 -->
    <button class="btn-secondary" id="viewResultBtn" style="display:none; margin-top:16px;" onclick="showResultView()">📂 查看已测代际结果</button>
  </div> <!-- 👈 这里必须有这个闭合标签！ -->

  <!-- Page 3: 答题 -->
  <div id="page-quiz" class="hidden">
    <div class="quiz-header">
      <span>题目 <span id="qNum">1</span> / 20</span>
      <span id="remainHint" style="color:#ff6b9d;"></span>
    </div>
    <div class="progress"><div class="progress-fill" id="prog"></div></div>
    <div class="q-text" id="qText"></div>
    <div id="opts"></div>
    <div class="quiz-nav">
      <button class="btn-secondary" id="prevBtn" onclick="prevQuestion()">← 上一题</button>
      <button class="btn-secondary" id="nextBtn" onclick="nextQuestion()" disabled>下一题 →</button>
    </div>
  </div>

<!-- Page 4: 结算确认 -->
<div id="page-confirm" class="hidden">
  <div class="confirm-box">
    <div style="font-size:60px; margin-bottom:20px;">🎯</div>
    <h2>你已完成全部 20 题</h2>
    <p style="color:#888; font-size:14px; line-height:1.6; margin:0 0 30px;">系统将解析你的 5 维性格向量，<br>在候选原型中匹配你的本命 Idol。</p>
    <button class="btn-primary" onclick="startCalc()">开始测算</button>
    <button class="btn-secondary" style="margin-top:10px;" onclick="backToLastQ()">返回检查答案</button>
  </div>
</div>

  <!-- Page 5: 计算进度 -->
  <div id="page-calc" class="hidden">
    <div class="calc-box">
      <div class="spinner">💫</div>
      <h2 style="margin:0 0 10px;">正在生成你的专属档案</h2>
      <div class="calc-bar"><div class="calc-fill" id="calcFill"></div></div>
      <div id="calcText" style="color:#ff6b9d; font-size:14px; min-height:20px;">正在解析你的 20 个选择...</div>
      <div id="calcPct" style="color:#666; font-size:12px; margin-top:8px;">0%</div>
    </div>
  </div>

  <!-- Page 6: 结果 -->
  <div id="page-result" class="hidden">
    <div class="gen-tabs" id="genTabs"></div>
    <div class="result-container" id="resultContent">
      <!-- 动态注入内容 -->
    </div>
    <p style="text-align:center; color:#666; font-size:13px; margin:20px 0;">👆 长按上方卡片保存海报</p>
    <div id="statusArea" style="text-align:center;"></div>
    <button class="btn-secondary" style="margin-top:10px;" onclick="location.reload()">返回首页</button>
  </div>

</div>

  T: { name: '理性逻辑', desc: '你处理问题和做决定的方式。高分代表脑性女、数据派；低分代表感性、直觉系。' },

  A: { name: '野心攻击', desc: '你的竞争意识和掌控欲。高分代表大女主、想赢；低分代表佛系、与世无争。' },

const GEN_NAMES = { gen2: '二代', gen3: '三代', gen4: '四代', gen5: '五代' };

// ========== 状态 ==========
let currentCode = '';
let currentGen = '';
let remaining = 0;
let serverResults = {};
let answers = new Array(20).fill(null);
let currentQ = 0;

function show(id) {
  document.querySelectorAll('.wrap > div').forEach(d => d.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}
function showMsg(text) { document.getElementById('msg').innerText = text; }

// 1. 验证授权码
async function checkCode() {
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  if (code.length !== 6) return showMsg('请输入完整的 6 位授权码');

  const btn = document.getElementById('checkBtn');
  btn.disabled = true; btn.innerText = '验证中...'; showMsg('');

  try {
    const res = await fetch('/api/check', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }) });
    
    // 🚨 核心修复：检查响应是否为 JSON，防止后端返回 500 HTML 页面导致解析崩溃
    const contentType = res.headers.get("content-type");
    if (!contentType || !contentType.includes("application/json")) {
      throw new Error("后端未正常响应 (可能是 KV 未绑定或 functions 文件夹缺失)");
    }

    const data = await res.json();
    if (data.error) { 
      showMsg(data.error); 
      btn.disabled = false; btn.innerText = '开始测试'; 
      return; 
    }

    currentCode = code;
    remaining = data.remaining;
    serverResults = data.results || {};
    const hasResult = Object.keys(serverResults).length > 0;

    if (remaining > 0) {
      document.getElementById('genRemainHint').innerText = `剩余 ${remaining} 次测试机会`;
      document.getElementById('viewResultBtn').style.display = hasResult ? 'block' : 'none';
      show('page-gen');
    } else {
      if (hasResult) {
        currentGen = Object.keys(serverResults)[0];
        showResultView();
      } else {
        showMsg('该授权码测试次数已用完，且无历史记录');
      }
    }
    btn.disabled = false; btn.innerText = '开始测试';
  } catch (e) {
    console.error("Check API Error:", e);
    showMsg('请求失败: ' + e.message); 
    btn.disabled = false; btn.innerText = '开始测试';
  }
}


// 2. 选代际进入答题
function selectGen(gen) {
  if (remaining <= 0) return alert('测试次数已用完，无法再次测试');
  currentGen = gen;
  answers = new Array(20).fill(null);
  currentQ = 0;
  document.getElementById('remainHint').innerText = `剩余 ${remaining} 次`;
  show('page-quiz');
  renderQuestion();
}

// 3. 渲染题目
function renderQuestion() {
  const q = questions[currentGen][currentQ]; // 根据代际取题
  document.getElementById('qNum').innerText = currentQ + 1;
  document.getElementById('qText').innerText = q.q;
  document.getElementById('prog').style.width = `${(currentQ / 20) * 100}%`;
  document.getElementById('prevBtn').disabled = (currentQ === 0);
  document.getElementById('nextBtn').disabled = (answers[currentQ] === null);

  const container = document.getElementById('opts');
  container.innerHTML = '';
  q.opts.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'opt' + (answers[currentQ] === idx ? ' selected' : '');
    btn.innerText = opt.t;
    btn.onclick = () => selectOption(idx);
    container.appendChild(btn);
  });
}

// 4. 选选项
function selectOption(idx) {
  answers[currentQ] = idx;
  renderQuestion();
}

// 5. 上一题
function prevQuestion() {
  if (currentQ > 0) { currentQ--; renderQuestion(); }
}

// 6. 下一题
function nextQuestion() {
  if (answers[currentQ] === null) return;
  currentQ++;
  if (currentQ < 20) renderQuestion();
  else show('page-confirm');
}

// 7. 返回检查
function backToLastQ() {
  currentQ = 19;
  document.getElementById('remainHint').innerText = `剩余 ${remaining} 次`;
  show('page-quiz');
  renderQuestion();
}

// 8. 开始结算
function startCalc() {
  show('page-calc');
  const fill = document.getElementById('calcFill');
  const pct = document.getElementById('calcPct');
  const txt = document.getElementById('calcText');
  const steps = ['正在解析你的 20 个选择...', '构建 5 维性格向量场...', '扫描候选原型人格图谱...', '计算多维空间共振频率...', '生成专属档案海报...'];
  let p = 0, lastSi = -1;
  fill.style.width = '0%'; pct.innerText = '0%'; txt.innerText = steps[0];
  const iv = setInterval(() => {
    p += 100 / 30;
    if (p >= 100) {
      p = 100; clearInterval(iv);
      fill.style.width = '100%'; pct.innerText = '100%';
      setTimeout(submitResult, 300);
      return;
    }
    fill.style.width = p + '%';
    pct.innerText = Math.floor(p) + '%';
    const si = Math.min(steps.length - 1, Math.floor(p / 100 * steps.length));
    if (si !== lastSi) { txt.innerText = steps[si]; lastSi = si; }
  }, 100);
}

// 9. 计算分数
function calcScores() {
  const s = [0, 0, 0, 0, 0];
  answers.forEach((idx, i) => {
    if (idx != null) {
      const opt = questions[currentGen][i].opts[idx];
      for (let j = 0; j < 5; j++) s[j] += opt.s[j];
    }
  });
  return s;
}

// 10. 匹配 + 保存
async function submitResult() {
  const userScores = calcScores();
  
  let bestMatch = idols[currentGen][0], minDiff = Infinity;
  idols[currentGen].forEach(idol => {
    let diff = 0;
    for (let i = 0; i < 5; i++) diff += Math.pow(userScores[i] - idol.scores[i], 2);
    if (diff < minDiff) { minDiff = diff; bestMatch = idol; }
  });

  const dimChampions = [];
  for (let i = 0; i < 5; i++) {
    let bestIdol = idols[currentGen][0], minD = Infinity;
    idols[currentGen].forEach(idol => {
      const d = Math.abs(userScores[i] - idol.scores[i]);
      if (d < minD) { minD = d; bestIdol = idol; }
    });
    dimChampions.push(bestIdol);
  }

  // 🚨 核心修复：保存 details 和 summary 对象，而不是单一的 detail
  const resultData = { 
    name: bestMatch.name, 
    desc: bestMatch.desc, 
    summary: bestMatch.summary,       // 新增
    details: bestMatch.details,       // 修改：保存完整的 details 对象
    scores: userScores, 
    dimChampions: dimChampions.map(id => id.name),
    matched_at: new Date().toISOString() 
  };

  try {
    const res = await fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: currentCode, gen: currentGen, resultData }) });
    
    const contentType = res.headers.get("content-type");
    if (!contentType || !contentType.includes("application/json")) {
      throw new Error("后端保存失败 (请检查 KV 绑定)");
    }

    const data = await res.json();
    if (data.success) {
      remaining = data.remaining;
      serverResults[currentGen] = data.result;
      showResultView();
    } else {
      alert('保存失败：' + data.error);
      location.reload();
    }
  } catch (e) {
    console.error("Save API Error:", e);
    alert('请求失败: ' + e.message + '\n\n💡 提示');
    location.reload();
  }
}

// 12. 绘制雷达图 (Canvas)
function drawRadar(scores, champions) {
  const canvas = document.getElementById('radarCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const cx = w / 2, cy = h / 2;
  const R = 100; // 半径
  const maxScore = 80; // 20题 x 4分
  
  ctx.clearRect(0, 0, w, h);
  
  // 画网格 (5层)
  for (let level = 1; level <= 5; level++) {
    const r = (R / 5) * level;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const angle = (Math.PI * 2 / 5) * i - Math.PI / 2;
      const x = cx + r * Math.cos(angle);
      const y = cy + r * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = '#333';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  
  // 画轴线
  for (let i = 0; i < 5; i++) {
    const angle = (Math.PI * 2 / 5) * i - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + R * Math.cos(angle), cy + R * Math.sin(angle));
    ctx.strokeStyle = '#444';
    ctx.stroke();
  }
  
  // 画数据多边形
  ctx.beginPath();
  const points = [];
  for (let i = 0; i < 5; i++) {
    const angle = (Math.PI * 2 / 5) * i - Math.PI / 2;
    const r = (scores[i] / maxScore) * R;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    points.push({x, y, angle});
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(255, 51, 102, 0.3)';
  ctx.fill();
  ctx.strokeStyle = '#ff3366';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // 画顶点和文字
  ctx.fillStyle = '#fff';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  
  for (let i = 0; i < 5; i++) {
    const p = points[i];
    // 画圆点
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#ff3366';
    ctx.fill();
    
    // 文字位置 (向外偏移)
    const tx = cx + (R + 25) * Math.cos(p.angle);
    const ty = cy + (R + 25) * Math.sin(p.angle);
    
    // 维度名 + 分数
    ctx.fillStyle = '#ff6b9d';
    ctx.fillText(`${DIM_NAMES[i]}`, tx, ty - 8);
    ctx.fillStyle = '#fff';
    ctx.fillText(`${scores[i]}分`, tx, ty + 8);
    
    // 冠军名字 (再向外)
    const tx2 = cx + (R + 55) * Math.cos(p.angle);
    const ty2 = cy + (R + 55) * Math.sin(p.angle);
    ctx.fillStyle = '#888';
    ctx.font = '10px sans-serif';
    // 简短名字
    const shortName = champions[i].split(' ')[0]; 
    ctx.fillText(shortName, tx2, ty2);
  }
}

document.getElementById('codeInput').addEventListener('input', function(e) { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
document.getElementById('codeInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') checkCode(); });
</script>
</body>
